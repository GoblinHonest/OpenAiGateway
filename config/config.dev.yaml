server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 60s
  idle_timeout: 120s
  max_header_bytes: 1048576
  graceful_shutdown_timeout: 30s

database:
  driver: "sqlite"
  dsn: "./data/gateway.db"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 2
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s

auth:
  admin_token: "admin-dev-token"
  api_key_header: "Authorization"
  api_key_prefix: "Bearer "

rate_limit:
  enabled: false
  default_rpm: 1000
  default_tpm: 1000000
  burst_size: 100

circuit_breaker:
  enabled: true
  failure_threshold: 3
  success_threshold: 1
  cooldown_duration: 30s

retry:
  max_attempts: 2
  initial_backoff: 500ms
  max_backoff: 5s
  backoff_multiplier: 2.0
  retryable_status_codes: [408, 429, 500, 502, 503, 504]

health_check:
  enabled: true
  interval: 1m
  timeout: 5s
  healthy_threshold: 1
  unhealthy_threshold: 2

log:
  level: "debug"
  format: "text"
  output: "stdout"

metrics:
  enabled: true
  path: "/metrics"
  port: 9090

tracing:
  enabled: false

reconciliation:
  enabled: false

event_bus:
  buffer_size: 100
  workers: 2

http_client:
  max_idle_conns: 10
  max_idle_conns_per_host: 2
  idle_conn_timeout: 30s
  tls_handshake_timeout: 10s
  expect_continue_timeout: 1s

streaming:
  buffer_size: 4096
  max_chunk_size: 1024
  flush_interval: 100ms
  keepalive_interval: 15s

cache:
  enabled: false
  ttl: 1m
  max_size: 100

protocol:
  default_format: "openai"
  auto_detect: true
