server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 60s
  idle_timeout: 120s
  max_header_bytes: 1048576
  graceful_shutdown_timeout: 30s

database:
  driver: "sqlite"
  dsn: "./data/gateway.db"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 1h
  conn_max_idle_time: 30m
  sqlite:
    journal_mode: "WAL"
    busy_timeout: 5000
    cache_size: -20000

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s

auth:
  admin_token: "admin-xxxxxxxxxxxxxxxx"
  api_key_header: "Authorization"
  api_key_prefix: "Bearer "

rate_limit:
  enabled: true
  default_rpm: 60
  default_tpm: 100000
  burst_size: 10

circuit_breaker:
  enabled: true
  failure_threshold: 5
  success_threshold: 2
  cooldown_duration: 60s

retry:
  max_attempts: 3
  initial_backoff: 1s
  max_backoff: 10s
  backoff_multiplier: 2.0
  retryable_status_codes: [408, 429, 500, 502, 503, 504]

health_check:
  enabled: true
  interval: 5m
  timeout: 10s
  healthy_threshold: 2
  unhealthy_threshold: 3

log:
  level: "info"
  format: "json"
  output: "stdout"
  file:
    path: "./logs/gateway.log"
    max_size: 100
    max_backups: 7
    max_age: 30
    compress: true

metrics:
  enabled: true
  path: "/metrics"
  port: 9090

tracing:
  enabled: false
  provider: "jaeger"
  endpoint: "http://localhost:14268/api/traces"
  sample_rate: 0.1

reconciliation:
  enabled: true
  schedule: "0 2 * * *"
  types:
    - "token_quota"
    - "usage_stats"
    - "cost"

event_bus:
  buffer_size: 1000
  workers: 4

http_client:
  max_idle_conns: 100
  max_idle_conns_per_host: 10
  idle_conn_timeout: 90s
  tls_handshake_timeout: 10s
  expect_continue_timeout: 1s

streaming:
  buffer_size: 4096
  max_chunk_size: 1024
  flush_interval: 100ms
  keepalive_interval: 15s

cache:
  enabled: true
  ttl: 5m
  max_size: 1000

protocol:
  default_format: "openai"
  auto_detect: true
