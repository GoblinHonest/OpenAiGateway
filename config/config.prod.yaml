# Production Environment Configuration

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 60s
  idle_timeout: 120s
  max_header_bytes: 1048576
  graceful_shutdown_timeout: 30s

# 生产环境必须使用MySQL/PostgreSQL
database:
  driver: "mysql"
  dsn: "${MYSQL_DSN}"  # 从环境变量读取
  max_open_conns: 200
  max_idle_conns: 20
  conn_max_lifetime: 1h
  conn_max_idle_time: 30m

redis:
  addr: "${REDIS_ADDR}"
  password: "${REDIS_PASSWORD}"
  db: 0
  pool_size: 200
  min_idle_conns: 20
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s

auth:
  admin_token: "${ADMIN_TOKEN}"
  api_key_header: "Authorization"
  api_key_prefix: "Bearer "

rate_limit:
  enabled: true
  default_rpm: 60
  default_tpm: 100000
  burst_size: 10

circuit_breaker:
  enabled: true
  failure_threshold: 5
  success_threshold: 2
  cooldown_duration: 60s

retry:
  max_attempts: 3
  initial_backoff: 1s
  max_backoff: 10s
  backoff_multiplier: 2.0
  retryable_status_codes: [408, 429, 500, 502, 503, 504]

health_check:
  enabled: true
  interval: 5m
  timeout: 10s
  healthy_threshold: 2
  unhealthy_threshold: 3

log:
  level: "info"
  format: "json"
  output: "stdout"
  file:
    path: "/var/log/aigateway/gateway.log"
    max_size: 100
    max_backups: 30
    max_age: 90
    compress: true

metrics:
  enabled: true
  path: "/metrics"
  port: 9090

tracing:
  enabled: true
  provider: "jaeger"
  endpoint: "${JAEGER_ENDPOINT}"
  sample_rate: 0.01  # 生产环境降低采样率

reconciliation:
  enabled: true
  schedule: "0 2 * * *"
  types:
    - "token_quota"
    - "usage_stats"
    - "cost"

event_bus:
  buffer_size: 2000
  workers: 8

http_client:
  max_idle_conns: 200
  max_idle_conns_per_host: 20
  idle_conn_timeout: 90s
  tls_handshake_timeout: 10s
  expect_continue_timeout: 1s

streaming:
  buffer_size: 8192
  max_chunk_size: 2048
  flush_interval: 100ms
  keepalive_interval: 15s

cache:
  enabled: true
  ttl: 10m
  max_size: 5000

protocol:
  default_format: "openai"
  auto_detect: true